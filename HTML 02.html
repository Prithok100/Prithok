<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Snake Game</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: sans-serif;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const gridSize = 20;
    const cubeSize = 1;
    const snake = [{ x: 0, y: 0, z: 0 }];
    let direction = { x: 1, y: 0, z: 0 };
    let food = null;
    let score = 0;

    const snakeMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    const foodMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });

    function createCube(x, y, z, material) {
      const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
      const cube = new THREE.Mesh(geometry, material);
      cube.position.set(x, y, z);
      scene.add(cube);
      return cube;
    }

    const snakeCubes = [createCube(0, 0, 0, snakeMaterial)];

    function spawnFood() {
      const x = Math.floor(Math.random() * gridSize) - gridSize / 2;
      const z = Math.floor(Math.random() * gridSize) - gridSize / 2;
      food = { x, y: 0, z };
      if (food.mesh) scene.remove(food.mesh);
      food.mesh = createCube(x, 0, z, foodMaterial);
    }

    spawnFood();
    camera.position.y = 10;
    camera.position.z = 10;
    camera.lookAt(0, 0, 0);

    function updateSnake() {
      const newHead = {
        x: snake[0].x + direction.x,
        y: 0,
        z: snake[0].z + direction.z
      };

      // Wall collision
      if (Math.abs(newHead.x) > gridSize / 2 || Math.abs(newHead.z) > gridSize / 2) {
        alert("Game Over! Final Score: " + score);
        window.location.reload();
      }

      // Self collision
      for (let segment of snake) {
        if (segment.x === newHead.x && segment.z === newHead.z) {
          alert("Game Over! Final Score: " + score);
          window.location.reload();
        }
      }

      snake.unshift(newHead);
      const cube = createCube(newHead.x, 0, newHead.z, snakeMaterial);
      snakeCubes.unshift(cube);

      // Check food collision
      if (newHead.x === food.x && newHead.z === food.z) {
        score++;
        document.getElementById("score").innerText = "Score: " + score;
        spawnFood();
      } else {
        scene.remove(snakeCubes.pop());
        snake.pop();
      }
    }

    function animate() {
      setTimeout(() => {
        requestAnimationFrame(animate);
        updateSnake();
        renderer.render(scene, camera);
      }, 200);
    }

    animate();

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp" && direction.z === 0) direction = { x: 0, y: 0, z: -1 };
      else if (event.key === "ArrowDown" && direction.z === 0) direction = { x: 0, y: 0, z: 1 };
      else if (event.key === "ArrowLeft" && direction.x === 0) direction = { x: -1, y: 0, z: 0 };
      else if (event.key === "ArrowRight" && direction.x === 0) direction = { x: 1, y: 0, z: 0 };
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
